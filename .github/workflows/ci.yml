name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Normalize Rust formatting
        working-directory: src-tauri
        run: cargo fmt

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libudev-dev librsvg2-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      - name: Generate platform icons
        working-directory: src-tauri
        run: cargo tauri icon ../assets/gearpilot-icon.svg

      - name: JavaScript and project validation
        run: |
          node --check ui/app.js
          node scripts/validate.mjs

      - name: Rust check
        working-directory: src-tauri
        run: cargo check
