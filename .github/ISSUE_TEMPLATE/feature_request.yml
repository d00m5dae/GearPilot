name: Feature request
description: Suggest a GearPilot feature or UX improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What is annoying or missing today?
    validations: {required: true}
  - type: textarea
    id: idea
    attributes:
      label: Proposed behavior
    validations: {required: true}
